name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/R4GNARWR/pensieve-backend

          docker build \
            --tag "$IMAGE:${{ github.sha }}" \
            ./penseve-backend

          docker push "$IMAGE:${{ github.sha }}"
