name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build and push application images
        env:
          IMAGE_PREFIX: ghcr.io/r4gnarwr/pensieve
        run: |
          docker build \
            --tag "$IMAGE_PREFIX-backend:$GITHUB_SHA" \
            ./pensieve-backend

          docker push "$IMAGE_PREFIX-backend:$GITHUB_SHA"

          docker build \
            --tag "$IMAGE_PREFIX-frontend:$GITHUB_SHA" \
            ./pensieve-frontend

          docker push "$IMAGE_PREFIX-frontend:$GITHUB_SHA"
