name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build and push application images
        env:
          IMAGE_PREFIX: ghcr.io/r4gnarwr/pensieve
        run: |
          docker build \
            --tag "$IMAGE_PREFIX-backend:$GITHUB_SHA" \
            ./pensieve-backend

          docker push "$IMAGE_PREFIX-backend:$GITHUB_SHA"

          docker build \
            --tag "$IMAGE_PREFIX-frontend:$GITHUB_SHA" \
            ./pensieve-frontend

          docker push "$IMAGE_PREFIX-frontend:$GITHUB_SHA"

      - name: Trigger infrastructure deployment
        env:
          DISPATCH_TOKEN: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          INFRA_REPOSITORY: r4gnarwr/pensieve-infrastructure
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$INFRA_REPOSITORY/dispatches" \
            -d "{\"event_type\":\"images-published\",\"client_payload\":{\"version\":\"$GITHUB_SHA\"}}"